<body>

<span id="contadorCarrinho"

<div class="flex flex-col lg:flex-row min-h-screen">

<!-- SIDEBAR -->

<aside class="w-full lg:w-72 bg-black text-white p-8 lg:rounded-r-[40px] shadow-2xl lg:sticky lg:top-0 lg:h-screen overflow-y-auto">

<p class="tracking-[0.3em] text-gray-500 text-sm mb-4">
CASALETI
</p>

<h2 class="text-3xl font-light mb-10">

<div class="space-y-8">

<div>

</label>

<label class="flex items-center gap-3 text-gray-300 cursor-pointer">

<input type="checkbox"
class="accent-white filtro"
value="centro">

class="accent-white filtro"

<label class="flex items-center gap-3 text-gray-300 cursor-pointer">

class="accent-white filtro"
value="industrial">

</label>

<label class="flex items-center gap-3 text-gray-300 cursor-pointer">

<input type="checkbox"
class="accent-white filtro"
value="escada">

Escadas

</label>

</div>

</div>

<div>

<h3 class="text-gray-400 mb-4 text-sm tracking-widest">
PREÇO MÁXIMO
</h3>

<input type="range"
min="100"
max="5000"
value="5000"
id="filtroPreco"
class="w-full accent-white">

<p id="valorPreco"
class="mt-3 text-gray-300">

Até R$5000

</p>

</div>

</div>

</aside>

<!-- CONTEÚDO -->

<main class="flex-1 p-6 md:p-10">

<a href="index.html"
class="inline-flex items-center gap-3 bg-white px-5 py-3 rounded-full shadow-lg hover:scale-105 transition mb-10">

<i data-lucide="arrow-left" class="w-4 h-4"></i>

Página inicial

</a>

<div class="mb-12">

<p class="tracking-[0.3em] text-gray-400 text-sm mb-3">
CASALETI
</p>

<h1 class="text-4xl md:text-5xl font-light">

Mesas e Suportes

</h1>

</div>

<!-- PRODUTOS -->

<div id="produtos"
class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8">

</div>

</main>

</div>

<!-- MODAL -->

<div id="modal"
class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">

<div class="bg-white rounded-[36px] p-8 md:p-10 max-w-2xl w-full relative shadow-2xl">

<button onclick="fecharModal()"
class="absolute top-5 right-5 w-11 h-11 rounded-full bg-black text-white flex items-center justify-center">

<i data-lucide="x" class="w-5 h-5"></i>

</button>

<div>

<p class="tracking-[0.25em] text-gray-400 text-sm mb-3">
CASALETI
</p>

<h2 id="modalTitulo"
class="text-4xl font-light mb-4"></h2>

<p id="modalPreco"
class="text-2xl mb-3"></p>

<p id="modalDim"
class="text-gray-500 mb-6"></p>

<p id="modalDesc"
class="text-gray-600 leading-relaxed mb-8"></p>

<div class="space-y-4">

<button id="btnWhats"
class="bg-black text-white py-4 rounded-2xl w-full hover:bg-neutral-800 transition">

Falar no WhatsApp

</button>

<button onclick="addCarrinho()"
class="border border-black py-4 rounded-2xl w-full hover:bg-black hover:text-white transition">

Adicionar ao carrinho

</button>

</div>

</div>

</div>

</div>

<!-- OVERLAY -->

<div id="overlayCarrinho"
class="fixed inset-0 bg-black/50 hidden z-40 backdrop-blur-sm"
onclick="fecharCarrinho()"></div>

<!-- CARRINHO -->

<div id="carrinhoDrawer"
class="fixed top-0 right-0 w-full sm:w-[380px] h-full bg-white shadow-2xl translate-x-full transition-transform duration-300 z-50 flex flex-col">

<div class="p-6 border-b flex justify-between items-center">

<h2 class="text-2xl font-light">
Seu carrinho
</h2>

<button onclick="fecharCarrinho()">

<i data-lucide="x" class="w-5 h-5"></i>

</button>

</div>

<div id="listaCarrinho"
class="flex-1 overflow-y-auto p-6 space-y-4"></div>

<div class="p-6 border-t">

<button onclick="finalizarWhats()"
class="bg-black text-white w-full py-4 rounded-2xl hover:bg-neutral-800 transition">

Finalizar no WhatsApp

</button>

</div>

</div>

<script>

/* PRODUTOS */

const produtosLista=[

{
nome:"Mesa de Cabeceira",
preco:"R$180,00",
valor:180,
tipo:"suporte",
img:"mesa/mesamadeira.png",
dim:"35cm x 40cm x 47cm",
desc:"Mesa artesanal com acabamento sofisticado e design retrô minimalista."
},

{
nome:"Escada Para Mezanino",
preco:"R$4.300,00",
valor:4300,
tipo:"escada",
img:"mesa/escada.png",
dim:"4m x 0,9m",
desc:"Escada produzida em madeira natural com estética contemporânea. Possui 15 degraus com 40cm espessura"
},

{
nome:"Base para mesa",
preco:"R$340,00",
valor:340,
tipo:"suporte",
img:"mesa/mesa s bolacha - Copia.png",
dim:"80cm x 70cm diâmetro",
desc:"Ela destaca-se pela alta durabilidade e estabilidade, sendo capaz de suportar tampos pesados de madeira, mármore ou vidro"
},

{
nome:"Mesa de Centro Quadrada Moderna",
preco:"R$550,00",
valor:550,
tipo:"centro",
img:"mesa/mesacentro.png",
dim:"100cm x 100cm x 40cm",
desc:"Mesa de centro quadrada com acabamento amadeirado escuro e visual minimalista. Seu design moderno e elegante proporciona praticidade e sofisticação para salas de estar, recepções, escritórios e ambientes corporativos. Uma peça versátil que harmoniza facilmente com diferentes estilos de decoração."
},

{
nome:"Suporte Ornamental Quadrado",
preco:"R$240,00",
valor:240,
tipo:"suporte",
img:"mesa/basequadrada.png",
dim:"45cm x 45cm x 60cm",
desc:"Aparador artesanal perfeito para halls e salas modernas."
},
{
nome:"Trava para 5 Bicicletas",
preco:"R$580,00",
valor:580,
tipo:"industrial",
img:"mesa/bicicleta.png",
dim:"*Consultar dimensões",
desc:"Bicicletário metálico desenvolvido para organização e estacionamento seguro de bicicletas em condomínios, empresas, escolas, comércios, praças e áreas públicas. Fabricado em aço resistente, possui estrutura reforçada com capacidade para acomodar até 5 bicicletas de forma prática e organizada, otimizando o espaço disponível."
},
{
nome:"Suporte Orgânico",
preco:"R$240,00",
valor:240,
tipo:"suporte",
img:"mesa/mesaornamental.png",
dim:"70cm x 40cm diâmetro",
desc:"Suporte decorativo produzido em ferro e design elegante de linhas curvas. Ideal para acomodar tampos de mesa e madeira. Seu estilo clássico agrega charme e sofisticação a salas, halls de entrada, varandas cobertas, eventos e decorações temáticas."
},

{
nome:"Aparador Multifuncional em Madeira e Ferro",
preco:"R$1300,00",
valor:1300,
tipo:"aparador",
img:"mesa/suporte gaveta.png",
dim:"*Consultar dimensões",
desc:"Móvel funcional com estrutura reforçada e gavetas para organização. Une praticidade e estilo, sendo ideal para salas, escritórios, cozinhas ou áreas comerciais."
},

{
nome:"Balcão com Prateleiras",
preco:"700,00",
valor:700,
tipo:"aparador",
img:"mesa/balcao.png",
dim:"2.60m x 0.65m | Balcão: 85cm x 65cm",
desc:"Balcão artesanal produzido em madeira maciça, combinando funcionalidade e elegância. Seu design robusto valoriza ambientes residenciais e comerciais, oferecendo amplo espaço de armazenamento e um visual atemporal que se adapta a diferentes estilos de decoração."
},


{
nome:"Torre Expositora de Chocolates + Caixa Protetora",
preco:"700,00",
valor:700,
tipo:"industrial",
img:"mesa/torre.png",
dim:"2.60m x 0.65m | Balcão: 85cm x 65cm",
desc:"Torre Expositora de Chocolates em Aço Inox + Caixa Protetora em Madeira, ideal para compor espaços gourmet, eventos corporativos, feiras e ativações de marca. Design moderno, elegante e funcional, proporcionando destaque aos produtos expostos e valorizando a apresentação do ambiente."
},


{
nome:"Suporte Decorativo",
preco:"R$680,00",
valor:680,
tipo:"industrial",
img:"mesa/suporte branco.png",
dim:"*Consultar dimensões e tamanhos",
desc:"Peças decorativas em ferro versáteis para exposição de vasos, esculturas e objetos ornamentais. Seu acabamento elegante valoriza ambientes internos e externos com sofisticação."
},

{
nome:"Estrutura Metálica para mesa",
preco:"R$380,00",
valor:380,
tipo:"suporte",
img:"mesa/mesas.png",
dim:"57cm x 30cm diâmetro",
desc:"Suporte com uma estrutura harmoniosa, criando uma peça sofisticada e versátil. Seu design moderno e leve é perfeito para salas, halls de entrada e ambientes decorativos. Sendo capaz de suportar tampos pesados de madeira, mármore ou vidro"
},

{
nome:"Suporte Artesanal para Rede",
preco:"R$3.500,00",
valor:3500,
tipo:"industrial",
img:"mesa/rede.png",
dim:"1,50m",
desc:"Estrutura resistente desenvolvida para proporcionar conforto e segurança. Fabricada com materiais de alta durabilidade, é ideal para áreas externas, varandas, jardins e espaços de lazer. Suporta até 180kg."
},

{
nome:"Bases de Máquina de Costura Vintage",
preco:"R$280,00",
valor:280,
tipo:"industrial",
img:"mesa/maquinacostura.jpg",
dim:"*Consultar dimensões e modelos",
desc:"Leve a autenticidade e o charme do estilo vintage para o seu ambiente com estas bases originais de máquinas de costura antigas (modelos Elgin e Vigorelli). Feitas em ferro fundido pesado e altamente resistente, essas peças carregam história e são a escolha perfeita para quem busca exclusividade em projetos de decoração."
},


{
nome:"Estrutura Metálica Decorativa",
preco:"R$240,00",
valor:240,
tipo:"industrial",
img:"mesa/suporte ornamental.png",
dim:"*Consultar dimensões e tamanhos",
desc:"Estrutura metálica decorativa com design elegante de linhas curvas. Seu estilo clássico agrega charme e sofisticação a salas, halls de entrada, varandas cobertas, eventos e decorações temáticas."
}



]

/* GERAR PRODUTOS */

const produtosContainer=document.getElementById("produtos")

produtosLista.forEach((prod,index)=>{

produtosContainer.innerHTML+=`

<div class="produto bg-white rounded-[30px] overflow-hidden shadow-lg hover:-translate-y-2 transition duration-500"
data-tipo="${prod.tipo}"
data-preco="${prod.valor}">

<div class="overflow-hidden">

<img src="${prod.img}"
class="w-full h-[320px] object-cover hover:scale-110 transition duration-700">

</div>

<div class="p-6">

<h3 class="text-xl mb-2">
${prod.nome}
</h3>

<p class="text-gray-400 mb-6">
${prod.preco}
</p>

<button onclick="abrirProduto(produtosLista[${index}])"
class="bg-black text-white w-full py-4 rounded-2xl hover:bg-neutral-800 transition">

Consultar

</button>

</div>

</div>

`

})

/* MODAL */

function abrirProduto(prod){

produtoAtual=prod

document.getElementById("modalTitulo").innerText=prod.nome

document.getElementById("modalPreco").innerText=prod.preco

document.getElementById("modalDim").innerText=`Dimensão: ${prod.dim}`

document.getElementById("modalDesc").innerText=prod.desc

document.getElementById("btnWhats").onclick=function(){

window.open(
`https://wa.me/5516999924544?text=Olá! Tenho interesse no produto: ${prod.nome}`
)

}

document
.getElementById("modal")
.classList.remove("hidden")

document
.getElementById("modal")
.classList.add("flex")

}

/* FECHAR MODAL */

function fecharModal(){

document
.getElementById("modal")
.classList.add("hidden")

document
.getElementById("modal")
.classList.remove("flex")

}

/* STORAGE */

function getCarrinho(){

return JSON.parse(localStorage.getItem("carrinho")) || []

}

function salvarCarrinho(carrinho){

localStorage.setItem(
"carrinho",
JSON.stringify(carrinho)
)

atualizarContador()

mostrarCarrinho()

}

/* ADD CARRINHO */

function addCarrinho(){

if(!produtoAtual) return

let carrinho=getCarrinho()

carrinho.push({

nome:produtoAtual.nome,

preco:produtoAtual.valor,

img:produtoAtual.img

})

salvarCarrinho(carrinho)

fecharModal()

}

/* DRAWER */

function abrirCarrinho(){

document
.getElementById("overlayCarrinho")
.classList.remove("hidden")

document
.getElementById("carrinhoDrawer")
.style.transform="translateX(0)"

mostrarCarrinho()

}

function fecharCarrinho(){

document
.getElementById("overlayCarrinho")
.classList.add("hidden")

document
.getElementById("carrinhoDrawer")
.style.transform="translateX(100%)"

}

/* MOSTRAR */

function mostrarCarrinho(){

let lista=document.getElementById("listaCarrinho")

let carrinho=getCarrinho()

lista.innerHTML=""

let total=0

if(carrinho.length===0){

lista.innerHTML=`

<div class="text-center text-gray-400 mt-10">

Seu carrinho está vazio

</div>

`

}

carrinho.forEach((prod,i)=>{

total+=Number(prod.preco)

lista.innerHTML+=`

<div class="border border-black/10 rounded-2xl p-4 flex gap-4 items-center">

<img src="${prod.img}"
class="w-16 h-16 rounded-xl object-cover">

<div class="flex-1">

<p class="text-sm">
${prod.nome}
</p>

<p class="font-semibold">
R$${Number(prod.preco).toFixed(2)}
</p>

</div>

<button onclick="removerItem(${i})"
class="text-red-500 text-lg">

✕

</button>

</div>

`

})

}

/* REMOVER */

function removerItem(i){

let carrinho=getCarrinho()

carrinho.splice(i,1)

salvarCarrinho(carrinho)

}

/* CONTADOR */

function atualizarContador(){

document
.getElementById("contadorCarrinho")
.innerText=getCarrinho().length

}

/* WHATS */

function finalizarWhats(){

let carrinho=getCarrinho()

if(carrinho.length===0){

alert("Seu carrinho está vazio!")

return

}

let texto="Olá! Tenho interesse nestes produtos:%0A%0A"

carrinho.forEach(p=>{

texto+=`- ${p.nome} (R$${Number(p.preco).toFixed(2)})%0A`

})

window.open(
`https://wa.me/5516999924544?text=${texto}`
)

}

/* FILTROS */

const filtros=document.querySelectorAll(".filtro")

filtros.forEach(f=>{

f.addEventListener("change",filtrarProdutos)

})

document.getElementById("filtroPreco")
.addEventListener("input",filtrarProdutos)

function filtrarProdutos(){

let precoMax=parseInt(
document.getElementById("filtroPreco").value
)

document.getElementById("valorPreco")
.innerText=`Até R$${precoMax}`

let tiposSelecionados=[]

filtros.forEach(f=>{

if(f.checked){
tiposSelecionados.push(f.value)
}

})

document.querySelectorAll(".produto")
.forEach(prod=>{

let preco=parseInt(prod.dataset.preco)

let tipo=prod.dataset.tipo

let passaPreco=preco<=precoMax

let passaTipo=
tiposSelecionados.length===0 ||
tiposSelecionados.includes(tipo)

if(passaPreco && passaTipo){

prod.style.display="block"

}else{

prod.style.display="none"

}

})

}

/* INIT */

lucide.createIcons()

atualizarContador()

</script>

</body>
</html>
