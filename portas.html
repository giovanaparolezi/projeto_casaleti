<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portas de Madeira - Casaleti</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<style>

html{
scroll-behavior:smooth;
}

body{
font-family:'Josefin Sans',sans-serif;
background:#efefef;
overflow-x:hidden;
}

/* scrollbar */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#111;
border-radius:999px;
}

</style>

</head>

<body>

<!-- CARRINHO -->

<div onclick="abrirCarrinho()"
class="fixed top-5 right-5 z-50 cursor-pointer">

<div class="relative bg-black text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:scale-105 transition duration-300">

<i data-lucide="shopping-bag" class="w-5 h-5"></i>

<span id="contadorCarrinho"
class="absolute -top-1 -right-1 bg-white text-black text-xs w-5 h-5 rounded-full flex items-center justify-center font-semibold">

0

</span>

</div>

</div>

<div class="flex flex-col lg:flex-row min-h-screen">

<!-- SIDEBAR -->

<aside class="w-full lg:w-72 bg-black text-white p-8 lg:rounded-r-[40px] shadow-2xl lg:sticky lg:top-0 lg:h-screen overflow-y-auto">

<p class="tracking-[0.3em] text-gray-500 text-sm mb-4">
CASALETI
</p>

<h2 class="text-3xl font-light mb-10">

Filtrar produtos

</h2>

<!-- FILTROS -->
<div class="sticky top-6 self-start">

    <div class="space-y-8">

        <div>
            <h3 class="text-gray-400 mb-4 text-sm tracking-widest">
                TIPO
            </h3>

            <div class="space-y-3">

                <label class="flex items-center gap-3 text-gray-300 cursor-pointer">
                    <input type="checkbox"
                           class="accent-white filtro"
                           value="pivotante">
                    Pivotante
                </label>

                <label class="flex items-center gap-3 text-gray-300 cursor-pointer">
                    <input type="checkbox"
                           class="accent-white filtro"
                           value="rustica">
                    Rústica
                </label>

                <label class="flex items-center gap-3 text-gray-300 cursor-pointer">
                    <input type="checkbox"
                           class="accent-white filtro"
                           value="moderna">
                    Moderna
                </label>

            </div>
        </div>

        <div>

            <h3 class="text-gray-400 mb-4 text-sm tracking-widest">
                PREÇO MÁXIMO
            </h3>

            <input type="range"
                   min="1000"
                   max="12000"
                   value="12000"
                   id="filtroPreco"
                   class="w-full accent-white">

            <p id="valorPreco"
               class="mt-3 text-gray-300">
                Até R$ 1.200,00
            </p>

        </div>

    </div>

</div>

</aside>

<!-- CONTEÚDO -->

<main class="flex-1 p-6 md:p-10">

<a href="index.html"
class="inline-flex items-center gap-3 bg-white px-5 py-3 rounded-full shadow-lg hover:scale-105 transition duration-300 mb-10">

<i data-lucide="arrow-left" class="w-4 h-4"></i>

Página inicial

</a>

<div class="mb-12">

<p class="tracking-[0.3em] text-gray-400 text-sm mb-3">
CASALETI
</p>

<h1 class="text-4xl md:text-5xl font-light">

Portas de Madeira

</h1>

</div>

<!-- PRODUTOS -->

<div id="produtos"
class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8">

</div>

</main>

</div>

<!-- MODAL -->

<div id="modal"
class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">

<div class="bg-white rounded-[36px] p-8 md:p-10 max-w-2xl w-full relative shadow-2xl">

<button onclick="fecharModal()"
class="absolute top-5 right-5 w-11 h-11 rounded-full bg-black text-white flex items-center justify-center">

<i data-lucide="x" class="w-5 h-5"></i>

</button>

<div>

<p class="tracking-[0.25em] text-gray-400 text-sm mb-3">
CASALETI
</p>

<h2 id="modalTitulo"
class="text-4xl font-light mb-4"></h2>

<p id="modalPreco"
class="text-2xl mb-3"></p>

<p id="modalDim"
class="text-gray-500 mb-6"></p>

<p id="modalDesc"
class="text-gray-600 leading-relaxed mb-8"></p>

<div class="space-y-4">

<button id="btnWhats"
class="bg-black text-white py-4 rounded-2xl w-full hover:bg-neutral-800 transition">

Falar no WhatsApp

</button>

<button onclick="addCarrinho()"
class="border border-black py-4 rounded-2xl w-full hover:bg-black hover:text-white transition">

Adicionar ao carrinho

</button>

</div>

</div>

</div>

</div>

<!-- OVERLAY -->

<div id="overlayCarrinho"
class="fixed inset-0 bg-black/50 hidden z-40 backdrop-blur-sm"
onclick="fecharCarrinho()"></div>

<!-- DRAWER -->

<div id="carrinhoDrawer"
class="fixed top-0 right-0 w-full sm:w-[380px] h-full bg-white shadow-2xl translate-x-full transition-transform duration-300 z-50 flex flex-col">

<div class="p-6 border-b flex justify-between items-center">

<h2 class="text-2xl font-light">

Seu carrinho

</h2>

<button onclick="fecharCarrinho()">

<i data-lucide="x" class="w-5 h-5"></i>

</button>

</div>

<div id="listaCarrinho"
class="flex-1 overflow-y-auto p-6 space-y-4"></div>

<div class="p-6 border-t">
    <p class="text-lg mb-5">

Total:
<span id="totalCarrinho" class="font-semibold">
R$0.00
</span>

</p>

<button onclick="finalizarWhats()"
class="bg-black text-white w-full py-4 rounded-2xl hover:bg-neutral-800 transition">

Finalizar no WhatsApp

</button>

</div>

</div>
<a
href="https://wa.me/5516999924544?text=Olá!%20Gostaria%20de%20mais%20informações."
target="_blank"
class="fixed bottom-6 right-6 z-50 hover:scale-110 transition">

<img
src="whats.png"
alt="WhatsApp"
class="w-16 h-16">

</a>
<script>

/* PRODUTOS */

const produtosLista=[

{
nome:"Porta Pivotante Premium",
preco:"R$3.500,00",
valor:3500,
tipo:"pivotante",
img:"portas.png",
dim:"*Consultar dimensões",
desc:"Porta pivotante em madeira natural com acabamento sofisticado."
},

{
nome:"Porta Rústica Artesanal",
preco:"R$3.200,00",
valor:3200,
tipo:"rustica",
img:"porta/portamadeira.png",
dim:"*Consultar dimensões",
desc:"Modelo rústico feito artesanalmente em madeira maciça."
},

{
nome:"Porta Moderna Minimalista",
preco:"R$3.900,00",
valor:3900,
tipo:"moderna",
img:"porta/portamadeira2.png",
dim:"*Consultar dimensões",
desc:"Design contemporâneo com linhas minimalistas elegantes."
},

{
nome:"Porta Colonial Floral",
preco:"R$2.000,00",
valor:2000,
tipo:"rustica",
img:"porta/porta4.png",
dim:"2,50m x 1,20m",
desc:"Fabricada em madeira maciça, combina resistência, durabilidade e sofisticação, sendo ideal para projetos residenciais, comerciais ou de restauração de ambientes históricos."
},


]

/* GERAR PRODUTOS */

function renderProdutos(lista){

const container=document.getElementById("produtos")

container.innerHTML=""

lista.forEach((prod,index)=>{

container.innerHTML+=`

<div class="produto bg-white rounded-[30px] overflow-hidden shadow-lg hover:-translate-y-2 transition duration-500"
data-tipo="${prod.tipo}"
data-preco="${prod.valor}">

<div class="overflow-hidden">

<img src="${prod.img}"
class="w-full h-[320px] object-cover hover:scale-110 transition duration-700">

</div>

<div class="p-6">

<h3 class="text-xl mb-2">
${prod.nome}
</h3>

<p class="text-gray-400 mb-6">
${prod.preco}
</p>

<button onclick="abrirProduto(produtosLista[${index}])"
class="bg-black text-white w-full py-4 rounded-2xl hover:bg-neutral-800 transition">

Consultar

</button>

</div>

</div>

`

})

}
let produtoAtual=null

/* MODAL */

function abrirProduto(prod){

produtoAtual=prod

document.getElementById("modalTitulo").innerText=prod.nome

document.getElementById("modalPreco").innerText=prod.preco

document.getElementById("modalDim").innerText=`Dimensão: ${prod.dim}`

document.getElementById("modalDesc").innerText=prod.desc

document.getElementById("btnWhats").onclick=function(){

window.open(
`https://wa.me/5516999924544?text=Olá! Tenho interesse no produto: ${prod.nome}`
)

}

document
.getElementById("modal")
.classList.remove("hidden")

document
.getElementById("modal")
.classList.add("flex")

}

/* FECHAR MODAL */

function fecharModal(){

document
.getElementById("modal")
.classList.add("hidden")

document
.getElementById("modal")
.classList.remove("flex")

}

/* STORAGE */

function getCarrinho(){

return JSON.parse(localStorage.getItem("carrinho")) || []

}

function salvarCarrinho(carrinho){

localStorage.setItem(
"carrinho",
JSON.stringify(carrinho)
)

atualizarContador()

mostrarCarrinho()

}

/* ADD CARRINHO */

function addCarrinho(){

if(!produtoAtual) return

let carrinho=getCarrinho()

carrinho.push({

nome:produtoAtual.nome,

preco:produtoAtual.valor,

img:produtoAtual.img

})

salvarCarrinho(carrinho)

fecharModal()

}

/* DRAWER */

function abrirCarrinho(){

document
.getElementById("overlayCarrinho")
.classList.remove("hidden")

document
.getElementById("carrinhoDrawer")
.style.transform="translateX(0)"

mostrarCarrinho()

}

function fecharCarrinho(){

document
.getElementById("overlayCarrinho")
.classList.add("hidden")

document
.getElementById("carrinhoDrawer")
.style.transform="translateX(100%)"

}

/* MOSTRAR */

function mostrarCarrinho(){

let lista=document.getElementById("listaCarrinho")

let carrinho=getCarrinho()

lista.innerHTML=""

let total=0

if(carrinho.length===0){

lista.innerHTML=`

<div class="text-center text-gray-400 mt-10">

Seu carrinho está vazio

</div>

`

}

carrinho.forEach((prod,i)=>{

total+=Number(prod.preco)

lista.innerHTML+=`

<div class="border border-black/10 rounded-2xl p-4 flex gap-4 items-center">

<img src="${prod.img}"
class="w-16 h-16 rounded-xl object-cover">

<div class="flex-1">

<p class="text-sm">
${prod.nome}
</p>

<p class="font-semibold">
R$${Number(prod.preco).toFixed(2)}
</p>

</div>

<button onclick="removerItem(${i})"
class="text-red-500 text-lg">

✕

</button>

</div>

`

})

}

/* REMOVER */

function removerItem(i){

let carrinho=getCarrinho()

carrinho.splice(i,1)

salvarCarrinho(carrinho)

}

/* CONTADOR */

function atualizarContador(){

document
.getElementById("contadorCarrinho")
.innerText=getCarrinho().length

}

/* WHATS */

function finalizarWhats(){

let carrinho=getCarrinho()

if(carrinho.length===0){

alert("Seu carrinho está vazio!")

return

}

let texto="Olá! Tenho interesse nestes produtos:%0A%0A"

carrinho.forEach(p=>{

texto+=`- ${p.nome} (R$${Number(p.preco).toFixed(2)})%0A`

})

window.open(
`https://wa.me/5516999924544?text=${texto}`
)

}

/* FILTROS */

const filtros=document.querySelectorAll(".filtro")

const filtroPreco=document.getElementById("filtroPreco")

function aplicarFiltros(){

const tiposSelecionados=[...filtros]
.filter(f=>f.checked)
.map(f=>f.value)

const precoMax=parseInt(filtroPreco.value)

document.getElementById("valorPreco")
.innerText=`Até R$${precoMax}`

document.querySelectorAll(".produto")
.forEach(prod=>{

const tipo=prod.dataset.tipo
const preco=parseInt(prod.dataset.preco)

const tipoOk=
tiposSelecionados.length===0 ||
tiposSelecionados.includes(tipo)

const precoOk=preco<=precoMax

prod.style.display=(tipoOk && precoOk)
? "block"
: "none"

})

}

filtros.forEach(f=>{

f.addEventListener("change",aplicarFiltros)

})

filtroPreco.addEventListener("input",aplicarFiltros)

/* INIT */

renderProdutos(produtosLista)

lucide.createIcons()

atualizarContador()

</script>

</body>
</html>
