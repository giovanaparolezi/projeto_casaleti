</p>

Bolachas de Madeira e Artesanato

</div>

</div>

<div id="modal"
class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">

<div class="bg-white rounded-[36px] p-8 md:p-10 max-w-2xl w-full relative shadow-2xl">

class="absolute top-5 right-5 w-11 h-11 rounded-full bg-black text-white flex items-center justify-center">

</button>

<div>

<p class="tracking-[0.25em] text-gray-400 text-sm mb-3">

</p>

<h2 id="modalTitulo"
class="text-4xl font-light mb-4"></h2>

<p id="modalPreco"
class="text-2xl mb-3"></p>

<p id="modalDim"
class="text-gray-500 mb-6"></p>

<p id="modalDesc"
class="text-gray-600 leading-relaxed mb-8"></p>

<div class="space-y-4">

<button id="btnWhats"
class="bg-black text-white py-4 rounded-2xl w-full hover:bg-neutral-800 transition">

Falar no WhatsApp

</button>

<button onclick="addCarrinho()"
class="border border-black py-4 rounded-2xl w-full hover:bg-black hover:text-white transition">

Adicionar ao carrinho

</button>

</div>

</div>

</div>

</div>

<!-- OVERLAY -->

<div id="overlayCarrinho"
class="fixed inset-0 bg-black/50 hidden z-40 backdrop-blur-sm"
onclick="fecharCarrinho()"></div>

<!-- DRAWER -->

<div id="carrinhoDrawer"
class="fixed top-0 right-0 w-full sm:w-[380px] h-full bg-white shadow-2xl translate-x-full transition-transform duration-300 z-50 flex flex-col">

<div class="p-6 border-b flex justify-between items-center">

<h2 class="text-2xl font-light">

Seu carrinho

</h2>

<button onclick="fecharCarrinho()">

<i data-lucide="x" class="w-5 h-5"></i>

</button>

</div>

<div id="listaCarrinho"
class="flex-1 overflow-y-auto p-6 space-y-4"></div>

<div class="p-6 border-t">

<div id="totalCarrinho"
class="mb-4 text-xl font-semibold text-left">
Total: R$ 0,00
</div>

<button onclick="finalizarWhats()"
class="bg-black text-white w-full py-4 rounded-2xl hover:bg-neutral-800 transition">

Finalizar no WhatsApp

</button>

</div>

</div>
<a
href="https://wa.me/5516999924544?text=Olá!%20Gostaria%20de%20mais%20informações."
target="_blank"
class="fixed bottom-6 right-6 z-50 hover:scale-110 transition">

<img
src="whats.png"
alt="WhatsApp"
class="w-16 h-16">

</a>
<script>

/* PRODUTOS */

const produtosLista=[
{
nome:"Mesa de Centro com Bolacha de Madeira",
preco:"R$250,00",
valor:"250",
tipo:"decorativa",
img:"bolacha/bolachas.png",
dim:"*Consultar dimensões",
desc:"Podem ser usadas sozinhas como mesa de centro/lateral ou combinadas em alturas diferentes. Cada peça é totalmente única, preservando as curvas orgânicas, as fissuras naturais, os nós e os anéis de crescimento da tora original. Um verdadeiro móvel de destaque para salas de estar, varandas gourmet, recepções ou escritórios."
},
{
nome:"Bolachas de Madeira",
preco:"R$250,00",
valor:"250",
tipo:"decorativa",
img:"bolacha/BOLACHAS22.png",
dim:"*Consultar dimensões",
desc:"Bolachas de madeira natural em diferentes tamanhos e formatos. Ideais para artesanato, decoração, centros de mesa, apoio para vasos, pintura, gravação e projetos personalizados."
},
{
nome:"Bolachas de Madeira Grande",
preco:"R$250,00",
valor:"250",
tipo:"decorativa",
img:"bolacha/bolachasmaiores.png",
dim:"*Consultar dimensões",
desc:"Peças de madeira maciça em grandes dimensões, com formato orgânico e acabamento natural. Perfeitas para tampos de mesa, decoração rústica, painéis decorativos e projetos exclusivos de marcenaria artesanal. Cada peça é única, valorizando os desenhos e veios naturais da madeira."
},


{
nome:"Pranchas de Madeira",
preco:"R$250,00",
valor:"250",
tipo:"artesanato",
img:"bolacha/pranchas.png",
dim:"*Consultar dimensões",
desc:"Perfeitas para a confecção de prateleiras suspensas, tampos de mesas de centro ou aparadores, cabeceiras, placas decorativas, relógios de parede rústicos, tábuas de corte gourmet ou trabalhos artísticos com resina epóxi"
},

{
nome:"Pés de Madeira para Mesas e Bancos",
preco:"R$250,00",
valor:"250",
tipo:"artesanato",
img:"bolacha/pes.png",
dim:"*Consultar dimensões",
desc:"Pés de madeira torneados, ideais para fabricação e restauração de mesas, banquetas e móveis artesanais. Produzidos em madeira natural, oferecem resistência, beleza e acabamento rústico para diversos projetos."
},



{
nome:"Suporte para vaso de flor",
preco:"R$250,00",
valor:"250",
tipo:"decorativa",
img:"bolacha/suporte.png",
dim:"*Consultar dimensões",
desc:"Suporte elegante com estrutura metálica e tampo em madeira natural. Perfeito para destacar vasos, flores e objetos decorativos em qualquer ambiente."
},


{
nome:"Mesa de Centro",
preco:"R$280,00",
valor:"280",
tipo:"decorativa",
img:"bolacha/bolachapecolorido.png",
dim:"de 20cm à 80cm",
desc:"Mesa artesanal produzida com bolacha de madeira natural e pés de ferro, unindo o charme rústico da madeira à alegria das cores. Ideal para decoração de salas, varandas, áreas gourmet, jardins e espaços infantis. Cada peça possui características únicas da madeira, tornando-a exclusiva e cheia de personalidade."
},


{
nome:"Mesa Rústica com Pés Coloridos",
preco:"R$280,00",
valor:"280",
tipo:"decorativa",
img:"bolacha/mesacolor.png",
dim:"de 20cm à 80cm",
desc:"Mesa artesanal produzida com bolacha de madeira natural e pés coloridos, unindo o charme rústico da madeira à alegria das cores. Ideal para decoração de salas, varandas, áreas gourmet, jardins e espaços infantis. Cada peça possui características únicas da madeira, tornando-a exclusiva e cheia de personalidade.."
},



{
nome:"Bandeja Galvanizada Multiuso",
preco:"R$70,00",
valor:70,
tipo:"artesanato",
img:"bolacha/galvanizada.png",
dim:"80cm x 54cm",
desc:"Produzida em chapa galvanizada de alta durabilidade. Indicada para apoio de vasos, organização de mudas e diversas aplicações em floriculturas, jardins e viveiros."
},

{
nome:"Balde Quadrado para Cultivo",
preco:"R$250,00",
valor:250,
tipo:"artesanato",
img:"bolacha/suportevaso.png",
dim:"*Consultar dimensões",
desc:"Balde plástico resistente, ideal para o desenvolvimento saudável de mudas, flores e pequenas plantas. Possui aberturas para melhor drenagem e ventilação das raízes. Capacidade: 20L."
},

{
nome:"Porta Vaso para 12 mudas",
preco:"R$25,00",
valor:25,
tipo:"artesanato",
img:"bolacha/portavaso.png",
dim:"*Consultar dimensões",
desc:"Ideal para organização e transporte de mudas. Possui capacidade para 12 vasinhos, oferecendo praticidade para viveiros, floriculturas e produtores. Fabricado em material resistente e reutilizável."
},

{
nome:"Roda Carroça",
preco:"R$950,00",
valor:950,
tipo:"artesanato",
img:"bolacha/roda.jpg",
dim:"*Consultar dimensões",
desc:"Peça original em madeira maciça, utilizada tradicionalmente em carroças ou carros de boi."
}

]

/* GERAR PRODUTOS */

function renderProdutos(lista){

const container=document.getElementById("produtos")

container.innerHTML=""

lista.forEach((prod,index)=>{

container.innerHTML+=`

<div class="produto bg-white rounded-[30px] overflow-hidden shadow-lg hover:-translate-y-2 transition duration-500"
data-tipo="${prod.tipo}"
data-preco="${prod.valor}">

<div class="overflow-hidden">

<img src="${prod.img}"
class="w-full h-[320px] object-cover hover:scale-110 transition duration-700">

</div>

<div class="p-6">

<h3 class="text-xl mb-2">
${prod.nome}
</h3>

<p class="text-gray-400 mb-6">
${prod.preco}
</p>

<button onclick="abrirProduto(produtosLista[${index}])"
class="bg-black text-white w-full py-4 rounded-2xl hover:bg-neutral-800 transition">

Consultar

</button>

</div>

</div>

`

})

}

/* MODAL */

function abrirProduto(prod){

produtoAtual=prod

document.getElementById("modalTitulo").innerText=prod.nome

document.getElementById("modalPreco").innerText=prod.preco

document.getElementById("modalDim").innerText=`Dimensão: ${prod.dim}`

document.getElementById("modalDesc").innerText=prod.desc

document.getElementById("btnWhats").onclick=function(){

window.open(
`https://wa.me/5516999924544?text=Olá! Tenho interesse no produto: ${prod.nome}`
)

}

document
.getElementById("modal")
.classList.remove("hidden")

document
.getElementById("modal")
.classList.add("flex")

}

/* FECHAR MODAL */

function fecharModal(){

document
.getElementById("modal")
.classList.add("hidden")

document
.getElementById("modal")
.classList.remove("flex")

}

/* STORAGE */

function getCarrinho(){

return JSON.parse(localStorage.getItem("carrinho")) || []

}

function salvarCarrinho(carrinho){

localStorage.setItem(
"carrinho",
JSON.stringify(carrinho)
)

atualizarContador()

mostrarCarrinho()

}

/* ADD CARRINHO */

function addCarrinho(){

if(!produtoAtual) return

let carrinho=getCarrinho()

carrinho.push({

nome:produtoAtual.nome,

preco:produtoAtual.valor,

img:produtoAtual.img

})

salvarCarrinho(carrinho)

fecharModal()

}

/* DRAWER */

function abrirCarrinho(){

document
.getElementById("overlayCarrinho")
.classList.remove("hidden")

document
.getElementById("carrinhoDrawer")
.style.transform="translateX(0)"

mostrarCarrinho()

}

function fecharCarrinho(){

document
.getElementById("overlayCarrinho")
.classList.add("hidden")

document
.getElementById("carrinhoDrawer")
.style.transform="translateX(100%)"

}

function mostrarCarrinho(){

let lista=document.getElementById("listaCarrinho")

let carrinho=getCarrinho()

lista.innerHTML=""

let total=0

if(carrinho.length===0){

lista.innerHTML=`

<div class="text-center text-gray-400 mt-10">

Seu carrinho está vazio

</div>

`

document.getElementById("totalCarrinho").innerText =
"Total: R$ 0,00"

return

}

carrinho.forEach((prod,i)=>{

total += Number(prod.preco)

lista.innerHTML+=`

<div class="border border-black/10 rounded-2xl p-4 flex gap-4 items-center">

<img src="${prod.img}"
class="w-16 h-16 rounded-xl object-cover">

<div class="flex-1">

<p class="text-sm">
${prod.nome}
</p>

<p class="font-semibold">
R$ ${Number(prod.preco).toFixed(2).replace(".",",")}
</p>

</div>

<button onclick="removerItem(${i})"
class="text-red-500 text-lg">

✕

</button>

</div>

`

})

document.getElementById("totalCarrinho").innerText =
`Total: R$ ${total.toFixed(2).replace(".", ",")}`

}

/* REMOVER */

function removerItem(i){

let carrinho=getCarrinho()

carrinho.splice(i,1)

salvarCarrinho(carrinho)

}

/* CONTADOR */

function atualizarContador(){

document
.getElementById("contadorCarrinho")
.innerText=getCarrinho().length

}

/* WHATS */

function finalizarWhats(){

let carrinho=getCarrinho()

if(carrinho.length===0){

alert("Seu carrinho está vazio!")

return

}

let texto="Olá! Tenho interesse nestes produtos:%0A%0A"

carrinho.forEach(p=>{

texto+=`- ${p.nome} (R$${Number(p.preco).toFixed(2)})%0A`

})

window.open(
`https://wa.me/5516999924544?text=${texto}`
)

}


/* FILTROS */

const filtros=document.querySelectorAll(".filtro")

const filtroPreco=document.getElementById("filtroPreco")

function aplicarFiltros(){

const tiposSelecionados=[...filtros]
.filter(f=>f.checked)
.map(f=>f.value)

const precoMax=parseInt(filtroPreco.value)

document.getElementById("valorPreco")
.innerText=`Até R$${precoMax}`

document.querySelectorAll(".produto")
.forEach(prod=>{

const tipo=prod.dataset.tipo
const preco=parseInt(prod.dataset.preco)

const tipoOk=
tiposSelecionados.length===0 ||
tiposSelecionados.includes(tipo)

const precoOk=preco<=precoMax

prod.style.display=(tipoOk && precoOk)
? "block"
: "none"

})

}

filtros.forEach(f=>{

f.addEventListener("change",aplicarFiltros)

})

filtroPreco.addEventListener("input",aplicarFiltros)

/* INIT */

renderProdutos(produtosLista)

lucide.createIcons()

atualizarContador()

</script>

</body>
