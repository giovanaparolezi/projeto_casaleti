body{

/* MODAL DE IMAGEM EM TELA CHEIA */
.modal-imagem {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.95);
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.modal-imagem.active {
    display: flex;
}

.modal-imagem img {
    max-width: 92%;
    max-height: 92%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.fechar-imagem {
    position: absolute;
    top: 25px;
    right: 35px;
    width: 50px;
    height: 50px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 1001;
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.fechar-imagem:hover {
    transform: scale(1.1);
    background: #f0f0f0;
}

.fechar-imagem i {
    width: 28px;
    height: 28px;
    color: black;
}

/* Estilo para as imagens dos produtos - cursor pointer */
.produto img {
    cursor: pointer;
}

/* RESPONSIVO: 2 produtos por linha no mobile */
@media (max-width: 640px) {
    .grid-produtos {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 1rem !important;
    }
    
    .grid-produtos .produto {
        width: 100% !important;
    }
    
    .grid-produtos .produto img {
        height: 180px !important;
        object-fit: cover !important;
    }
    
    .grid-produtos .produto .p-6 {
        padding: 0.75rem !important;
    }
    
    .grid-produtos .produto h3 {
        font-size: 0.8rem !important;
        margin-bottom: 0.25rem !important;
    }
    
    .grid-produtos .produto .text-gray-400 {
        font-size: 0.7rem !important;
        margin-bottom: 0.5rem !important;
    }
    
    .grid-produtos .produto button {
        padding: 0.5rem !important;
        font-size: 0.7rem !important;
    }
}

/* Ajuste para telas muito pequenas */
@media (max-width: 480px) {
    .grid-produtos {
        gap: 0.75rem !important;
    }
    
    .grid-produtos .produto img {
        height: 150px !important;
    }
    
    .grid-produtos .produto h3 {
        font-size: 0.7rem !important;
    }
}

</style>

/* FUNÇÃO PARA ABRIR IMAGEM EM TELA CHEIA */
function abrirImagemFullscreen(urlImagem) {
    const modalImagem = document.getElementById('modalImagem');
    const imagemFull = document.getElementById('imagemFullscreen');
    
    if (urlImagem && urlImagem !== '') {
        imagemFull.src = urlImagem;
        modalImagem.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        setTimeout(() => {
            lucide.createIcons();
        }, 50);
    }
}

/* FUNÇÃO PARA FECHAR MODAL DE IMAGEM */
function fecharImagemModal() {
    const modalImagem = document.getElementById('modalImagem');
    modalImagem.classList.remove('active');
    document.body.style.overflow = '';
}

/* Fechar modal de imagem com tecla ESC */
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        fecharImagemModal();
        fecharModal();
    }
});

/* GERAR PRODUTOS */
function renderProdutos(lista){
    const container=document.getElementById("produtos")
    container.innerHTML=""
    lista.forEach((prod,index)=>{
        container.innerHTML+=`
            <div class="produto bg-white rounded-[30px] overflow-hidden shadow-lg hover:-translate-y-2 transition duration-500"
            data-tipo="${prod.tipo}"
            data-preco="${prod.valor}">
                <div class="overflow-hidden">
                    <img src="${prod.img}"
                    class="w-full h-[320px] object-cover hover:scale-110 transition duration-700"
                    onclick="abrirImagemFullscreen('${prod.img}')">
                </div>
                <div class="p-6">
                    <h3 class="text-xl mb-2">${prod.nome}</h3>
                    <p class="text-gray-400 mb-6">${prod.preco}</p>
                    <button onclick="abrirProduto(produtosLista[${index}])"
                    class="bg-black text-white w-full py-4 rounded-2xl hover:bg-neutral-800 transition">
                    Consultar
                    </button>
                </div>
            </div>
        `
    })
}

let produtoAtual = null

/* MODAL PRODUTO */
function abrirProduto(prod){
    produtoAtual=prod
    document.getElementById("modalTitulo").innerText=prod.nome
    document.getElementById("modalPreco").innerText=prod.preco
    document.getElementById("modalDim").innerText=`Dimensão: ${prod.dim}`
    document.getElementById("modalDesc").innerText=prod.desc
    document.getElementById("btnWhats").onclick=function(){
        window.open(`https://wa.me/5516999924544?text=Olá! Tenho interesse no produto: ${prod.nome}`)
    }
    document.getElementById("modal").classList.remove("hidden")
    document.getElementById("modal").classList.add("flex")
}

/* FECHAR MODAL PRODUTO */
function fecharModal(){
    document.getElementById("modal").classList.add("hidden")
    document.getElementById("modal").classList.remove("flex")
}

/* STORAGE */
function getCarrinho(){
    return JSON.parse(localStorage.getItem("carrinho")) || []
}

function salvarCarrinho(carrinho){
    localStorage.setItem("carrinho", JSON.stringify(carrinho))
    atualizarContador()
    mostrarCarrinho()
}

/* ADD CARRINHO */
function addCarrinho(){
    if(!produtoAtual) return
    let carrinho=getCarrinho()
    carrinho.push({
        nome:produtoAtual.nome,
        preco:produtoAtual.valor,
        img:produtoAtual.img
    })
    salvarCarrinho(carrinho)
    fecharModal()
}

/* DRAWER */
function abrirCarrinho(){
    document.getElementById("overlayCarrinho").classList.remove("hidden")
    document.getElementById("carrinhoDrawer").style.transform="translateX(0)"
    mostrarCarrinho()
}

function fecharCarrinho(){
    document.getElementById("overlayCarrinho").classList.add("hidden")
    document.getElementById("carrinhoDrawer").style.transform="translateX(100%)"
}

function mostrarCarrinho(){
    let lista=document.getElementById("listaCarrinho")
    let carrinho=getCarrinho()
    lista.innerHTML=""
    let total=0
    if(carrinho.length===0){
        lista.innerHTML=`<div class="text-center text-gray-400 mt-10">Seu carrinho está vazio</div>`
        document.getElementById("totalCarrinho").innerText = "Total: R$ 0,00"
        return
    }
    carrinho.forEach((prod,i)=>{
        total += Number(prod.preco)
        lista.innerHTML+=`
            <div class="border border-black/10 rounded-2xl p-4 flex gap-4 items-center">
                <img src="${prod.img}" class="w-16 h-16 rounded-xl object-cover">
                <div class="flex-1">
                    <p class="text-sm">${prod.nome}</p>
                    <p class="font-semibold">R$ ${Number(prod.preco).toFixed(2).replace(".",",")}</p>
                </div>
                <button onclick="removerItem(${i})" class="text-red-500 text-lg">✕</button>
            </div>
        `
    })
    document.getElementById("totalCarrinho").innerText = `Total: R$ ${total.toFixed(2).replace(".", ",")}`
}

/* REMOVER */
function removerItem(i){
    let carrinho=getCarrinho()
    carrinho.splice(i,1)
    salvarCarrinho(carrinho)
}

/* CONTADOR */
function atualizarContador(){
    document.getElementById("contadorCarrinho").innerText=getCarrinho().length
}

/* WHATS */
function finalizarWhats(){
    let carrinho=getCarrinho()
    if(carrinho.length===0){
        alert("Seu carrinho está vazio!")
        return
    }
    let texto="Olá! Tenho interesse nestes produtos:%0A%0A"
    carrinho.forEach(p=>{
        texto+=`- ${p.nome} (R$${Number(p.preco).toFixed(2)})%0A`
    })
    window.open(`https://wa.me/5516999924544?text=${texto}`)
}

/* FILTROS */
const filtros=document.querySelectorAll(".filtro")
const filtroPreco=document.getElementById("filtroPreco")

function aplicarFiltros(){
    const tiposSelecionados=[...filtros].filter(f=>f.checked).map(f=>f.value)
    const precoMax=parseInt(filtroPreco.value)
    document.getElementById("valorPreco").innerText=`Até R$${precoMax}`
    document.querySelectorAll(".produto").forEach(prod=>{
        const tipo=prod.dataset.tipo
        const preco=parseInt(prod.dataset.preco)
        const tipoOk=tiposSelecionados.length===0 || tiposSelecionados.includes(tipo)
        const precoOk=preco<=precoMax
        prod.style.display=(tipoOk && precoOk) ? "block" : "none"
    })
}

filtros.forEach(f=>{
    f.addEventListener("change",aplicarFiltros)
})

filtroPreco.addEventListener("input",aplicarFiltros)

/* INIT */
renderProdutos(produtosLista)
lucide.createIcons()
atualizarContador()

</script>
